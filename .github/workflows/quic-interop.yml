name: QUIC interop

# Runs quickstep's QUIC stack through the quic-interop-runner
# (https://github.com/quic-interop/quic-interop-runner) against other
# implementations, as server and as client. The endpoint image is built
# from integration/quic-interop-runner/ with gcc. Manual only; results go to the
# job summary and the logs are kept as artifacts.
#
# By default every implementation in the runner's implementations_quic.json is
# a peer, read from the runner when the workflow runs so that new ones are
# picked up. A peer that is only a client (chrome) is run against quickstep as
# server only, and one that is only a server (nginx, haproxy) against quickstep
# as client only.

on:
  workflow_dispatch:
    inputs:
      peers:
        description: 'Peer implementations (comma-separated names from implementations_quic.json; empty tests all of them)'
        default: ''
        type: string
      tests:
        description: 'Test cases (comma-separated; empty runs the whole suite)'
        default: ''
        type: string
      ref:
        description: 'quickstep commit, branch or tag to build the endpoint from (empty builds this workflow''s own commit)'
        default: ''
        type: string
      congestion_control:
        description: 'quickstep congestion controller (cubic is the library default)'
        default: 'cubic'
        type: choice
        options:
          - cubic
          - newreno

permissions:
  contents: read

jobs:
  # Which peers to run, and in which directions each can be run, from the
  # runner's own list. Done apart from the image build so the two overlap.
  peers:
    name: Peer list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out the runner's implementation list
        uses: actions/checkout@v7
        with:
          repository: quic-interop/quic-interop-runner
          sparse-checkout: implementations_quic.json
          sparse-checkout-cone-mode: false

      - name: Build the matrix
        id: matrix
        env:
          PEERS: ${{ inputs.peers }}
        run: |
          want=$(printf '%s' "$PEERS" | tr -d ' ')
          # A name that is not in the list is an error, not a smaller run.
          unknown=$(jq -r --arg want "$want" '
            ($want | split(",") | map(select(length > 0))) - keys | join(", ")
          ' implementations_quic.json)
          if [ -n "$unknown" ]; then
            echo "::error::Not in the runner's implementations_quic.json: $unknown"
            exit 1
          fi
          # quickstep is the one under test, not a peer. A peer that can be a
          # client is run against quickstep as server, and one that can be a
          # server against quickstep as client.
          matrix=$(jq -c --arg want "$want" '
            ($want | split(",") | map(select(length > 0))) as $w
            | to_entries
            | map(select(.key != "quickstep"))
            | map(select(($w | length) == 0 or (.key as $k | $w | index($k) != null)))
            | map({peer: .key,
                   quickstep_server: (.value.role == "both" or .value.role == "client"),
                   quickstep_client: (.value.role == "both" or .value.role == "server")})
          ' implementations_quic.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '.[] | "\(.peer): quickstep as server \(.quickstep_server), as client \(.quickstep_client)"'

  image:
    name: Build endpoint image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The Dockerfile configures with CC=gcc and builds with -Werror, so a
      # warning is a failure here.
      - name: Build image
        env:
          CONGESTION_CONTROL: ${{ inputs.congestion_control }}
        run: |
          docker build -f integration/quic-interop-runner/Dockerfile \
            --build-arg CONGESTION_CONTROL="$CONGESTION_CONTROL" \
            -t quickstep-interop:ci .

      - name: Save image
        run: docker save quickstep-interop:ci | zstd -T0 -o quickstep-interop.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: quickstep-interop-image
          path: quickstep-interop.tar.zst
          retention-days: 1

  interop:
    name: "vs ${{ matrix.peer }}"
    needs: [peers, image]
    # Not ubuntu-latest: on 26.04 the TShark from the archive (4.6.4, where
    # the nightly PPA had 5.1) cannot read the simulator's pcaps, which empties
    # the ACK and frame analysis.  Pinned to what the earlier runs used until
    # that is understood.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.peers.outputs.matrix) }}
    steps:
      - name: Check out the interop runner
        uses: actions/checkout@v7
        with:
          repository: quic-interop/quic-interop-runner
          path: runner

      # The analysis scripts come from this workflow's own commit, so a run
      # of an older quickstep (inputs.ref) is analysed the same way.
      - name: Check out the analysis scripts
        uses: actions/checkout@v7
        with:
          path: quickstep-ci
          sparse-checkout: integration/quic-interop-runner

      # The runner's compose file needs a newer engine than the runner
      # image ships; this mirrors the runner's own CI.
      - uses: docker/setup-docker-action@v5
        with:
          version: version=v28.3.0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Enable IPv6 in the simulator
        run: sudo modprobe ip6table_filter

      - name: Install Wireshark
        run: |
          sudo add-apt-repository -y ppa:wireshark-dev/nightly
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tshark
          tshark --version | head -n 1

      - name: Install runner dependencies
        run: pip install -r runner/requirements.txt

      - uses: actions/download-artifact@v8
        with:
          name: quickstep-interop-image

      - name: Load endpoint image
        run: zstd -d -c quickstep-interop.tar.zst | docker load

      # Both directions lint the qlogs their endpoint wrote; the check is
      # inside the image so that it is the one the endpoint was built with.
      - name: Write the qlog check
        run: |
          cat > "$RUNNER_TEMP/lint_qlogs.sh" <<'LINT'
          # lint_qlogs LOGDIR SIDE PEER: check every qlog under LOGDIR, print
          # a markdown paragraph.  Never fails: the verdict is in the text.
          lint_qlogs ()
          {
            dir=$1; side=$2; peer=$3
            n=$(find "$dir" -name '*.qlog.txt' | wc -l)
            echo "#### qlogs, quickstep $side vs $peer: $n files"
            echo
            if [ "$n" -eq 0 ]; then echo "none written"; return 0; fi
            if (cd "$dir" && find . -name '*.qlog.txt' -print0 \
                  | xargs -0 -n 400 docker run --rm -v "$PWD":/logs:ro \
                      -w /logs --entrypoint /quickstep/qlog-lint \
                      quickstep-interop:ci) > "$RUNNER_TEMP/lint.out" 2>&1
            then rc=0; else rc=1; fi
            echo '```'
            if [ "$rc" -eq 0 ]; then grep ' faults$' "$RUNNER_TEMP/lint.out"
            else grep -v '^ ' "$RUNNER_TEMP/lint.out" | head -n 40; fi
            echo '```'
            echo
          }
          LINT

      - name: Register quickstep with the runner
        working-directory: runner
        run: |
          jq '. + {"quickstep": {"image": "quickstep-interop:ci", "url": "https://github.com/cpkb-bluezoo/quickstep", "role": "both"}}' \
            implementations_quic.json > implementations_quic.json.new
          mv implementations_quic.json.new implementations_quic.json
          python implementations.py -p quic

      - name: quickstep server, ${{ matrix.peer }} client
        if: matrix.quickstep_server
        working-directory: runner
        env:
          TESTS: ${{ inputs.tests }}
          PEER: ${{ matrix.peer }}
          REF: ${{ inputs.ref }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/results"
          args=(-s quickstep -c "$PEER" --markdown
                --log-dir "$GITHUB_WORKSPACE/logs/quickstep-server"
                --json "$GITHUB_WORKSPACE/results/server-quickstep_client-$PEER.json")
          if [ -n "$TESTS" ]; then args+=(-t "$TESTS"); fi
          python run.py "${args[@]}" | tee server.txt || true
          { echo "### quickstep server, $PEER client (quickstep ${REF:-$GITHUB_SHA})"; echo; cat server.txt; echo; } >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/quickstep-ci/integration/quic-interop-runner/ack_stats.py" server \
            "$GITHUB_WORKSPACE/logs/quickstep-server" > acks.md || echo "ack_stats failed" > acks.md
          python3 "$GITHUB_WORKSPACE/quickstep-ci/integration/quic-interop-runner/dump_frames.py" server \
            "$GITHUB_WORKSPACE/logs/quickstep-server" || true
          # the endpoint's own counters (loss, RTT, congestion window, goodput)
          grep -r --include=endpoint.log '^STATS ' "$GITHUB_WORKSPACE/logs/quickstep-server" > stats.txt || true
          { echo "#### ACK-only packets, quickstep server vs $PEER"; echo; cat acks.md; echo; } >> "$GITHUB_STEP_SUMMARY"
          # the job summary is not readable from the gh CLI, the log is
          echo "ACK-only packets, quickstep server vs $PEER (quickstep ${REF:-$GITHUB_SHA})"; cat acks.md
          echo "Connection statistics, quickstep server vs $PEER"; cat stats.txt
          . "$RUNNER_TEMP/lint_qlogs.sh"
          lint_qlogs "$GITHUB_WORKSPACE/logs/quickstep-server" server "$PEER" | tee qlint.md >> "$GITHUB_STEP_SUMMARY"

      - name: ${{ matrix.peer }} server, quickstep client
        if: always() && matrix.quickstep_client
        working-directory: runner
        env:
          TESTS: ${{ inputs.tests }}
          PEER: ${{ matrix.peer }}
          REF: ${{ inputs.ref }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/results"
          args=(-s "$PEER" -c quickstep --markdown
                --log-dir "$GITHUB_WORKSPACE/logs/quickstep-client"
                --json "$GITHUB_WORKSPACE/results/server-${PEER}_client-quickstep.json")
          if [ -n "$TESTS" ]; then args+=(-t "$TESTS"); fi
          python run.py "${args[@]}" | tee client.txt || true
          { echo "### $PEER server, quickstep client (quickstep ${REF:-$GITHUB_SHA})"; echo; cat client.txt; echo; } >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/quickstep-ci/integration/quic-interop-runner/ack_stats.py" client \
            "$GITHUB_WORKSPACE/logs/quickstep-client" > acks.md || echo "ack_stats failed" > acks.md
          python3 "$GITHUB_WORKSPACE/quickstep-ci/integration/quic-interop-runner/dump_frames.py" client \
            "$GITHUB_WORKSPACE/logs/quickstep-client" || true
          # the endpoint's own counters (loss, RTT, congestion window, goodput)
          grep -r --include=endpoint.log '^STATS ' "$GITHUB_WORKSPACE/logs/quickstep-client" > stats.txt || true
          { echo "#### ACK-only packets, quickstep client vs $PEER"; echo; cat acks.md; echo; } >> "$GITHUB_STEP_SUMMARY"
          # the job summary is not readable from the gh CLI, the log is
          echo "ACK-only packets, quickstep client vs $PEER (quickstep ${REF:-$GITHUB_SHA})"; cat acks.md
          echo "Connection statistics, quickstep client vs $PEER"; cat stats.txt
          . "$RUNNER_TEMP/lint_qlogs.sh"
          lint_qlogs "$GITHUB_WORKSPACE/logs/quickstep-client" client "$PEER" | tee qlint.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quic-interop-${{ matrix.peer }}
          if-no-files-found: warn
          path: |
            logs/
            results/
