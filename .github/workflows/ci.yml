name: CI

# Builds quickstep with gcc, warnings as errors, and runs the test suite.
# Both happen in the build stages of the interop endpoint's Dockerfile
# (tests/quic-interop-runner/Dockerfile), which also builds the libgcrypt
# that quickstep needs and Ubuntu 24.04 does not have: one definition of the
# build, used here and for the image the interop workflow runs.

on:
  push:

permissions:
  contents: read

jobs:
  gcc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The layers that build libgpg-error and libgcrypt do not change from
      # one push to the next, so they come from the Actions cache.
      - uses: docker/setup-buildx-action@v4

      - name: Build and test with gcc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tests/quic-interop-runner/Dockerfile
          target: check
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
