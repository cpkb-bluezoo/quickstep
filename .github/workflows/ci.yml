name: CI

# Builds quickstep with gcc, warnings as errors, and runs the unit tests and,
# separately, the integration tests.  All of it happens in the build stages
# of the interop endpoint's Dockerfile
# (integration/quic-interop-runner/Dockerfile), which also builds the libgcrypt
# that quickstep needs and Ubuntu 24.04 does not have: one definition of the
# build, used here and for the image the interop workflow runs.
#
# ML-DSA is libgcrypt's, so its tests run in every job.  The distribution's
# GnuTLS has no ML-DSA of its own, though, so what needs that (its keys, its
# agreement with libgcrypt, chains signed with ML-DSA) would otherwise never
# run.  The "ML-DSA" job builds a GnuTLS with the leancrypto backend (pinned
# in the Dockerfile) and runs the unit tests against it with GQ_EXPECT_MLDSA
# set, which makes those tests fail instead of skipping if the backend is
# missing.

on:
  push:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (gcc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The layers that build libgpg-error and libgcrypt do not change from
      # one push to the next, so they come from the Actions cache.
      - uses: docker/setup-buildx-action@v4

      - name: Build and run the unit tests with gcc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: integration/quic-interop-runner/Dockerfile
          target: check
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: Integration tests (gcc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build and run the integration tests with gcc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: integration/quic-interop-runner/Dockerfile
          target: integration
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mldsa:
    name: Unit tests with ML-DSA (gcc, GnuTLS with leancrypto)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Building leancrypto, Nettle and GnuTLS takes a while and does not
      # depend on the sources: those layers come from the Actions cache.  The
      # cache has a scope of its own so that the other jobs' layers do not
      # push them out.
      - uses: docker/setup-buildx-action@v4

      - name: Build and run the unit tests against an ML-DSA capable GnuTLS
        uses: docker/build-push-action@v7
        with:
          context: .
          file: integration/quic-interop-runner/Dockerfile
          target: check-mldsa
          push: false
          cache-from: type=gha,scope=mldsa
          cache-to: type=gha,mode=max,scope=mldsa
